[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frametalk-capability"
version = "0.1.0"
description = "帧言 Python 能力 Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0,<2",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
frametalk-capability = "frametalk_capability.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frametalk_capability"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/frametalk_capability"]

[tool.uv]
package = true
